[package]
name = "finanz-manager"
version = "0.1.0"
description = "Desktop-App zum Tracken von Finanzen und Abos"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "finanz_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
